[project]
name = "aegis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "psycopg2-binary==2.9.12",
    "redis==8.1.0",
    "structlog==26.1.0",
    "sentry-sdk==2.66.1",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["db", "parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
