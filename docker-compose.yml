# docker-compose.yml — Aegis local stack (KCH-33)
# Three services: db (postgres:16), redis (redis:8), api (built from Dockerfile).
# Migrations run automatically before uvicorn starts.
# All configuration via environment; copy .env.example → .env and edit.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build: .
    image: aegis-api
    # Run migrations first, then start the API server.
    # Migrations are idempotent: safe to run on every container restart.
    command: >
      sh -c "python db/migrate.py up && uvicorn api.app:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aegis:aegis@db:5432/aegis}
      AEGIS_API_KEY: ${AEGIS_API_KEY:?AEGIS_API_KEY must be set — see .env.example}
      AEGIS_REDIS_URL: ${AEGIS_REDIS_URL:-redis://redis:6379}
      AEGIS_LOG_FORMAT: ${AEGIS_LOG_FORMAT:-json}
      AEGIS_ENV: ${AEGIS_ENV:-production}
      # Optional — uncomment to enable Sentry error tracking:
      # SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  pgdata:
    driver: local
