name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: A concise description of the bug
      placeholder: "e.g. Aegis scanner crashes on binary files"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior
      placeholder: |
        1. Run `aegis scan --target ./binary`
        2. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error output, logs, or screenshots.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Aegis version (`aegis --version`)
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, etc.
      placeholder: "e.g. macOS 14, Python 3.12"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else relevant (config files, related issues, etc.)
    validations:
      required: false
