name: CI

on:
  push:
    branches: [main, development, "feature/**"]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check
        run: mypy . --ignore-missing-imports || true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and all dependencies from lockfile
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run pytest --cov=. --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — gitleaks scans all commits

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run gitleaks (full history)
        run: gitleaks detect --source . --log-opts="--all" --config .gitleaks.toml

  dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit production dependencies (fail on HIGH)
        # Audits only the packages declared in [project].dependencies
        # uv export produces a pinned requirements list from uv.lock
        run: |
          uv export --no-dev --frozen --format=requirements-txt -o /tmp/prod-requirements.txt
          pip-audit -r /tmp/prod-requirements.txt --format=json --output=/tmp/pip-audit.json
          python3 -c "
          import json, sys
          data = json.load(open('/tmp/pip-audit.json'))
          highs = [
              (dep['name'], dep['version'], v['id'])
              for dep in data.get('dependencies', [])
              for v in dep.get('vulns', [])
          ]
          if highs:
              for name, ver, vid in highs:
                  print(f'HIGH vuln: {name}=={ver} — {vid}', file=sys.stderr)
              sys.exit(1)
          print('pip-audit: no known vulnerabilities in production deps')
          "

  sbom:
    name: SBOM (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate pinned requirements from lockfile
        run: uv export --frozen --format=requirements-txt -o requirements-pinned.txt

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
        with:
          version: v0.64.0

      - name: Generate SBOM (CycloneDX)
        run: |
          trivy fs --format cyclonedx --output sbom.cdx.json .

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, test, secret-scan, dependency-audit, sbom]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" \
             || "${{ needs.test.result }}" != "success" \
             || "${{ needs.secret-scan.result }}" != "success" \
             || "${{ needs.dependency-audit.result }}" != "success" \
             || "${{ needs.sbom.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
