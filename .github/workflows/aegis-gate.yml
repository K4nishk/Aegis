name: Aegis Gate

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit

      - name: Bandit SAST scan
        run: bandit -r . -x .git,tests,venv,.venv --format json -o bandit-report.json || true

      - name: Safety vulnerability check
        run: |
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt --output json > safety-report.json || true
          fi

      - name: pip-audit
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --format json -o pip-audit-report.json || true
          fi

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json
          if-no-files-found: ignore

  audit-coverage:
    name: Audit Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=0 -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  gate-status:
    name: Aegis Gate Status
    runs-on: ubuntu-latest
    needs: [security-scan, audit-coverage]
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          if [[ "${{ needs.security-scan.result }}" == "failure" || "${{ needs.audit-coverage.result }}" == "failure" ]]; then
            echo "Aegis gate FAILED"
            exit 1
          fi
          echo "Aegis gate PASSED"
